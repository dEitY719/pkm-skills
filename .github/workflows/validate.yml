name: validate

# This repo owns no CI logic of its own. It calls the reusable workflow owned by
# `dEitY719/harness-skills` (dEitY719/dotfiles#1410 D-10), so a new check lands here the
# moment it lands there — no copy to keep in sync.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: dEitY719/harness-skills/.github/workflows/skill-check.yml@main
    with:
      plugin-name: pkm

  # Post-merge patch bump, owned by harness-skills: on a push to main that
  # changed shipped content, bump X.Y.Z -> X.Y.(Z+1) in every manifest and push
  # the commit. Needs write access, which only this caller can grant.
  version-bump:
    if: github.event_name == 'push'
    needs: validate
    permissions:
      contents: write
    uses: dEitY719/harness-skills/.github/workflows/version-bump.yml@main
